<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: PharmaCast Signature Emerald -->
    <linearGradient id="pharmaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#022c22" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- iOS-style Squircle Rounded Background -->
  <rect width="64" height="64" rx="16" fill="url(#pharmaBg)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Brand Capsule Icon (Rotated 45 degrees, centered at 32,32) -->
  <g transform="translate(32, 32) rotate(-45)" filter="url(#pillShadow)">
    <!-- Top Half of Capsule (Pure White) -->
    <path d="M -9,0 L -9,-11 A 9,9 0 0,1 9,-11 L 9,0 Z" fill="#ffffff"/>
    
    <!-- Bottom Half of Capsule (Mint Pastel Accent) -->
    <path d="M -9,0 L -9,11 A 9,9 0 0,0 9,11 L 9,0 Z" fill="#a7f3d0"/>
    
    <!-- Center Separation Line -->
    <line x1="-9" y1="0" x2="9" y2="0" stroke="#047857" stroke-width="1.2" stroke-opacity="0.35"/>
    
    <!-- Gloss Reflection on Upper Left Body -->
    <path d="M -5,-13 A 5,5 0 0,0 -5,-4" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>
  </g>
</svg>
